name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v), for dry runs'
        required: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  # Pinned deliberately. `channel: stable` floats, and a new SDK can change what
  # builds or what the analyzer reports without any code change — the CI
  # determinism rule forbids that, and release artifacts must be reproducible.
  # Bump this in its own delivery, verified locally first.
  # See docs/contributing/releasing.md.
  FLUTTER_VERSION: '3.44.8'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and verify it matches pubspec
        id: resolve
        run: |
          set -euo pipefail
          pubspec_version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$pubspec_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${pubspec_version}."
              exit 1
            fi
          else
            version="${{ inputs.version }}"
            [ -n "$version" ] || version="$pubspec_version"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building Genaisys ${version}"

  linux:
    name: Linux (GUI + CLI)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build GUI
        run: flutter build linux --release

      - name: Build CLI
        run: |
          set -euo pipefail
          bash .github/scripts/build_cli.sh genaisys-cli-linux-x64

      - name: Package portable tarball
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/genaisys"
          tar -C "$bundle" -czf "genaisys-linux-x64.tar.gz" .

      - name: Package .deb
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          root=deb-root
          rm -rf "$root"
          mkdir -p "$root/DEBIAN" "$root/opt/genaisys" "$root/usr/bin" \
                   "$root/usr/share/applications"

          cp -r "$bundle/." "$root/opt/genaisys/"
          chmod 755 "$root/opt/genaisys/genaisys"

          install -m 755 genaisys-cli-linux-x64 "$root/usr/bin/genaisys"
          ln -s /opt/genaisys/genaisys "$root/usr/bin/genaisys-gui"

          install -m 644 packaging/linux/genaisys.desktop \
            "$root/usr/share/applications/genaisys.desktop"

          for size in 16 24 32 48 64 128 256 512; do
            dir="$root/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dir"
            install -m 644 "assets/branding/genaisys-${size}.png" "$dir/genaisys.png"
          done
          mkdir -p "$root/usr/share/icons/hicolor/scalable/apps"
          install -m 644 assets/branding/genaisys.svg \
            "$root/usr/share/icons/hicolor/scalable/apps/genaisys.svg"

          installed_kb=$(du -sk "$root" | cut -f1)
          cat > "$root/DEBIAN/control" <<EOF
          Package: genaisys
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0t64 | libgtk-3-0, libblkid1, liblzma5
          Installed-Size: ${installed_kb}
          Maintainer: Niko Pascal Burkert <noreply@genaisys.dev>
          Homepage: https://github.com/nurkert/genAIsys-core
          Description: Sovereign orchestration for AI-assisted software delivery
           Genaisys drives AI coding agents through a gated lifecycle: planning,
           code generation, quality gates, independent review, and git delivery.
           Ships the desktop GUI and the genaisys command-line interface.
          EOF
          dpkg-deb --root-owner-group --build "$root" "genaisys_${VERSION}_amd64.deb"
          dpkg-deb --info "genaisys_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            genaisys_*_amd64.deb
            genaisys-linux-x64.tar.gz
            genaisys-cli-linux-x64
          retention-days: 14

  macos:
    name: macOS (GUI + CLI)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build GUI
        run: flutter build macos --release

      - name: Build CLI
        run: |
          set -euo pipefail
          bash .github/scripts/build_cli.sh genaisys-cli-macos-arm64

      - name: Package .app
        run: |
          set -euo pipefail
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "genaisys-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            genaisys-macos-arm64.zip
            genaisys-cli-macos-arm64
          retention-days: 14

  windows:
    name: Windows (GUI + CLI)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build GUI
        run: flutter build windows --release

      - name: Build CLI
        shell: bash
        run: bash .github/scripts/build_cli.sh genaisys-cli-windows-x64.exe

      - name: Package bundle
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/genaisys.exe")) { throw "GUI binary missing in $bundle" }
          Compress-Archive -Path "$bundle/*" -DestinationPath "genaisys-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            genaisys-windows-x64.zip
            genaisys-cli-windows-x64.exe
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: Genaisys ${{ needs.version.outputs.version }}
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            **Linux (Debian/Ubuntu)**
            ```bash
            sudo apt install ./genaisys_${{ needs.version.outputs.version }}_amd64.deb
            ```
            Launches from your app menu as **Genaisys**; the `genaisys` CLI lands on your `PATH`.

            **Linux (portable)**
            ```bash
            tar -xzf genaisys-linux-x64.tar.gz && ./genaisys
            ```

            **macOS** — unzip `genaisys-macos-arm64.zip` and move `genaisys.app` to `/Applications`.
            The build is unsigned: first launch needs right-click → Open.

            **Windows** — unzip `genaisys-windows-x64.zip` and run `genaisys.exe`.

            **CLI only** — grab the `genaisys-cli-*` binary for your platform; it is a
            self-contained executable with no Flutter runtime dependency.

            Verify downloads against `SHA256SUMS`.
